name: smartspend
description: SmartSpend — situation-first personal finance.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  go_router: 17.2.3
  flutter_screenutil: 5.9.3
  flutter_native_splash: 2.4.7
  shared_preferences: 2.5.5
  image_picker: 1.2.2
  path_provider: 2.1.5
  flutter_bloc: 9.1.1
  equatable: 2.0.7
  hive: 2.2.3
  hive_flutter: 1.1.0
  get_it: 8.0.3
  fpdart: 1.1.1
  intl: 0.20.3
  uuid: 4.5.1
  fl_chart: 0.70.2
  logger: 2.5.0
  flutter_secure_storage: 9.2.4
  flutter_local_notifications: 18.0.1
  local_auth: 2.3.0
  connectivity_plus: 6.1.4
  permission_handler: 11.4.0
  speech_to_text: 7.4.0
  encrypt: 5.0.3
  crypto: 3.0.6
  csv: 6.0.0
  archive: 4.0.7
  pdf: 3.11.3
  printing: 5.14.2
  http: 1.3.0
  local_auth_android: 1.0.47
  timezone: 0.10.0
  firebase_core: 3.13.0
  firebase_auth: 5.5.2
  cloud_firestore: 5.6.6
  firebase_crashlytics: 4.3.5
  firebase_analytics: 11.4.5
  shadcn_ui: 0.53.6
  fossui: ^0.1.1
  crystal_navigation_bar: 1.1.0
  share_plus: 11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  bloc_test: 10.0.0
  mocktail: 1.0.4
  flutter_launcher_icons: 0.14.3

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  background_image: assets/images/native_splash_bg.png
  background_image_dark: assets/images/native_splash_bg_dark.png
  android_gravity: fill
  fullscreen: true
  android_12:
    color: "#FFFFFF"
    color_dark: "#121212"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#121212"
  ios: true
  android: true
  web: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/splash.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/splash.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/wallets/
    - assets/illustrations/
