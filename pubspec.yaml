name: lifeiq
description: LifeIQ — an offline child-safety visual novel demo.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/scenarios/s1/
    - assets/scenarios/s2/
    - assets/scenarios/s3/
